const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=Object.keys(DATA),home=document.getElementById('home'),view=document.getElementById('categoryView');
document.getElementById('categories').innerHTML=names.map((name,i)=>`<button class="tile" data-index="${i}"><img loading="lazy" src="imagens/${images[name]}.jpg" alt="Imagem ilustrativa de ${safe(name)}"><span class="info">${safe(name)}<small>${DATA[name].length} opções</small></span></button>`).join('');
function show(i){const name=names[i];if(!name){goHome();return}const rows=DATA[name];document.getElementById('categoryContent').innerHTML=`<div class="category-top"><img src="imagens/${images[name]}.jpg" alt="Imagem ilustrativa"><div><h2>${safe(name)}</h2><p>${rows.length} opções</p></div></div>${rows.map(([n,p,d])=>`<article class="item"><div><strong>${safe(n)}</strong>${d?`<div class="desc">${safe(d)}</div>`:''}</div><span class="price">${p==='Consultar garçom'?'Consultar':`R$ ${safe(p)}`}</span></article>`).join('')}`;home.classList.add('hidden');view.classList.add('active');history.replaceState(null,'','#categoria-'+i);window.scrollTo({top:0,behavior:'instant'});}
function goHome(){view.classList.remove('active');home.classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);window.scrollTo({top:0,behavior:'instant'});}
